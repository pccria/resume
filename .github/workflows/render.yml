name: Render & Release LaTeX Resume

on:
  push:
    branches:
      - master
    paths:
      - 'resume/**'
      - '.github/workflows/render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume
          compiler: pdflatex

      - name: Rename PDF
        run: mv resume/resume.pdf resume/PooriaAskariMoqaddam.resume.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          retention-days: 7
          path: resume/PooriaAskariMoqaddam.resume.pdf

      - name: Determine Version Tag
        id: version
        run: |
          LATEST_TAG=$(git tag -l "V*" --sort=-creatordate | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION=1
          else
            VERSION=$(echo "$LATEST_TAG" | sed 's/V\([0-9]*\)\..*/\1/')
            VERSION=$((VERSION + 1))
          fi
          NEW_TAG="V${VERSION}.$(date +'%y')$(date +'%b' | tr '[:lower:]' '[:upper:]')$(date +'%d')"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Tag to release: $NEW_TAG"

      - name: Create Git Tag & GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ env.NEW_TAG }}"
          git push origin "${{ env.NEW_TAG }}"
          gh release create "${{ env.NEW_TAG }}" resume/PooriaAskariMoqaddam.resume.pdf \
            -t "${{ env.NEW_TAG }}" \
            -n "Automated release for ${{ env.NEW_TAG }}"
